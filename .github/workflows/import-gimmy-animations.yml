name: Import Gimmy Drive Animations
on:
  push:
    paths:
      - '.github/workflows/import-gimmy-animations.yml'
      - 'scripts/import_gimmy_animations.py'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/import_gimmy_animations.py
      - name: Commit optimized animation assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/gimmy/sprites2 src/gimmy/sprite-manifest2.json
          git commit -m "Import optimized Gimmy animation sequences"
          git pull --rebase origin main
          git push origin HEAD:main
